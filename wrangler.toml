# Cloudflare deployment for swarnalive.com.
# The database_id below is filled in by scripts/cloudflare-setup.sh.
name = "swarna-live"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = false

routes = [
  { pattern = "swarnalive.com", custom_domain = true },
  { pattern = "www.swarnalive.com", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "swarna-live-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "swarna-live-files"

[observability]
enabled = true
